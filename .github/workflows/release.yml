name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate version
        run: python scripts/check_release.py "${GITHUB_REF_NAME}"
      - name: Compile Python
        run: python -m compileall -q custom_components tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build HACS archive
        working-directory: custom_components
        run: zip -r ../http_requests.zip http_requests
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: http_requests.zip
